{{define "content"}}<section class="panel narrow"><h2>Set up this server</h2><p>Choose a public site name and an admin password. The site name is used as the web and API identity.</p>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/admin/setup"><input type="hidden" name="token" value="{{.SetupToken}}"><label>Public site name<input type="text" name="siteTitle" required maxlength="64" value="{{.SiteTitle}}" autocomplete="organization"></label><label>Administrator password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label><button type="submit">Save site name and password</button></form></section>{{end}}
